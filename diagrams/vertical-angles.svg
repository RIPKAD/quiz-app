<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="title desc">
  <title id="title">Vertical angles from two intersecting lines</title>
  <desc id="desc">Lines AB and CD intersect at E. Angle AED and angle CEB are vertical angles.</desc>
  <style>
    .edge { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .arc { fill: none; stroke: currentColor; stroke-width: 2; }
    .lbl { font: 700 16px system-ui, -apple-system, sans-serif; fill: currentColor; }
    .pt { fill: currentColor; }
  </style>
  <line class="edge" x1="30" y1="200" x2="290" y2="60"/>
  <line class="edge" x1="40" y1="50" x2="280" y2="210"/>
  <circle class="pt" cx="160" cy="130" r="3.5"/>
  <text class="lbl" x="18" y="214">A</text>
  <text class="lbl" x="298" y="58">B</text>
  <text class="lbl" x="24" y="48">C</text>
  <text class="lbl" x="286" y="226">D</text>
  <text class="lbl" x="168" y="122">E</text>
  <!-- small arcs marking a pair of vertical angles -->
  <path class="arc" d="M138,118 A28,28 0 0 1 148,102"/>
  <path class="arc" d="M172,142 A28,28 0 0 1 182,158"/>
</svg>
