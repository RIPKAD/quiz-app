<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
  <title id="title">Linear pair</title>
  <desc id="desc">Two adjacent angles on a straight line forming a linear pair.</desc>
  <style>
    .edge { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .arc { fill: none; stroke: currentColor; stroke-width: 2; }
    .lbl { font: 700 16px system-ui, -apple-system, sans-serif; fill: currentColor; }
    .pt { fill: currentColor; }
  </style>
  <line class="edge" x1="20" y1="160" x2="300" y2="160"/>
  <line class="edge" x1="160" y1="160" x2="230" y2="40"/>
  <path class="arc" d="M120,160 A40,40 0 0 1 175,128"/>
  <path class="arc" d="M200,160 A40,40 0 0 0 188,122"/>
  <circle class="pt" cx="160" cy="160" r="3.5"/>
  <text class="lbl" x="152" y="188">V</text>
  <text class="lbl" x="108" y="132">1</text>
  <text class="lbl" x="198" y="132">2</text>
</svg>
