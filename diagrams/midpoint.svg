<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-labelledby="title desc">
  <title id="title">Midpoint of a segment</title>
  <desc id="desc">Segment AC with midpoint B. AB equals BC.</desc>
  <style>
    .edge { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .tick { stroke: currentColor; stroke-width: 2; }
    .lbl { font: 700 16px system-ui, -apple-system, sans-serif; fill: currentColor; }
    .pt { fill: currentColor; }
  </style>
  <line class="edge" x1="40" y1="80" x2="280" y2="80"/>
  <line class="tick" x1="100" y1="70" x2="110" y2="90"/>
  <line class="tick" x1="210" y1="70" x2="220" y2="90"/>
  <circle class="pt" cx="40" cy="80" r="3.5"/>
  <circle class="pt" cx="160" cy="80" r="3.5"/>
  <circle class="pt" cx="280" cy="80" r="3.5"/>
  <text class="lbl" x="32" y="112">A</text>
  <text class="lbl" x="152" y="112">B</text>
  <text class="lbl" x="272" y="112">C</text>
</svg>
