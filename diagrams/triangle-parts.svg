<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="title desc">
  <title id="title">Median altitude and angle bisector</title>
  <desc id="desc">Triangle ABC with a segment from A to side BC.</desc>
  <style>
    .edge { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linejoin: round; }
    .dash { fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 6 5; }
    .lbl { font: 700 16px system-ui, -apple-system, sans-serif; fill: currentColor; }
    .pt { fill: currentColor; }
  </style>
  <polygon class="edge" points="160,36 40,220 280,220"/>
  <line class="dash" x1="160" y1="36" x2="160" y2="220"/>
  <circle class="pt" cx="160" cy="36" r="3.5"/>
  <circle class="pt" cx="40" cy="220" r="3.5"/>
  <circle class="pt" cx="280" cy="220" r="3.5"/>
  <circle class="pt" cx="160" cy="220" r="3.5"/>
  <text class="lbl" x="168" y="32">A</text>
  <text class="lbl" x="24" y="236">B</text>
  <text class="lbl" x="286" y="236">C</text>
  <text class="lbl" x="168" y="238">D</text>
</svg>
